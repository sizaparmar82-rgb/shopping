<!DOCTYPE html>
<html>
<head>
    <title>Nisho - Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5e6ff;
        }

        nav {
            background: #6a1b9a;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .box {
            width: 320px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #b1c709;
        }

        h2 {
            text-align: center;
            color: #6a1b9a;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #c9a4df;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #6a1b9a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #4a116c;
        }

        p {
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #6a1b9a;
        }
          .oo{ 
            text-align:center;
            
            margin-right: 20px;
            

        }
        .oo a{
            display: inline-block;
            background-color: #6a1b9a;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 10px;
            box-shadow: 0 2px 5px gray;
        }
    </style>
</head>

<body>

    <nav>
        <h1>SHOPE & Smile</h1>
        <p>Fashion • Style • Elegance</p>
    </nav>

    <div class="box">
        <h2>Create Account</h2>

        <form>
            <input type="text"
                   placeholder="Full Name" required>

            <input type="email"
                   placeholder="Email Address" required>

            <input type="tel"
                   placeholder="Mobile Number"
                   pattern="[0-9]{10}" required>

            <input type="text"
                   placeholder="Username" required>

            <input type="password"
                   placeholder="Create Password"
                   minlength="8" required>

            <input type="password"
                   placeholder="Confirm Password" required>
                   <div class="oo">
          <a href="siza.html"> Register Now</a></div>
        </form>

        
    </div>

</body>
</html>
