<!DOCTYPE html>
<html>
<head>
    <title>shop & Smile - Add to Cart</title>

    <style>
        body {
            background: #f5e6ff;
            font-family: Arial;
            margin: 0;
        }

        h1 {
            background: #6a1b9a;
            color: white;
            text-align: center;
            padding: 18px;
        }

        .cart {
            display: flex;
            background: white;
            margin: 30px;
            padding: 20px;
            gap: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #d3b5e8;
        }

        img {
            width: 220px;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
        }

        h2 {
            color: #6a1b9a;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
        }

        .discount {
            color: green;
        }

        select, input {
            padding: 7px;
            margin: 8px;
        }

        button {
            background: #6a1b9a;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            margin: 8px 3px;
            cursor: pointer;
        }

        .buy {
            background: #e91e63;
        }

        .delivery {
            background: #f5e6ff;
            padding: 10px;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .cart {
                margin: 15px;
                padding: 12px;
                gap: 12px;
            }

            img {
                width: 130px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <h1> shope & smile 🛍️</h1>

    <div class="cart">

        <img src="frock.jpg" alt="Purple Frock">

        <div>
            <h2>Beautiful Purple Frock</h2>

            <p>⭐ 4.5 | Fashion Collection</p>

            <p class="price">
                ₹799 <del>₹1299</del>
            </p>

            <p class="discount">38% OFF</p>

            <p>Colour: Purple 💜</p>

            <label>Size:</label>
            <select>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
            </select>

            <br>

            <label>Quantity:</label>
            <input type="number" value="1" min="1" max="10">

            <p class="delivery">
                🚚 Free Delivery Available
            </p>

            <p>✔️ Easy Returns</p>

            <button>
                Add to Cart
            </button>

            <button class="buy">
                Buy Now
            </button>
        </div>

    </div>

</body>
</html>
